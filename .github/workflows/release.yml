name: Release

# Cutting a release is a tag push. The job is CLIKit's, shared by the whole
# fleet: .github/workflows/release-cli.yml in arraypress/swift-cli-kit, which
# runs this repo's Scripts/build-release.sh and attaches the archive.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v"
        required: true

jobs:
  release:
    uses: arraypress/swift-cli-kit/.github/workflows/release-cli.yml@main
    with:
      version: ${{ inputs.version }}
    permissions:
      contents: write
    # DEPS_TOKEN, for tools with a private library dependency.
    secrets: inherit
